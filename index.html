<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emisor GPS - Transmisión en Vivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Transmisor GPS (Conductor)</h1>
        <div id="status-bar">Estado: <span id="status-text">Desconectado</span></div>
    </header>

    <main class="container-center">
        <section class="control-card">
            <h2>Configurar Transmisión</h2>

            <div class="user-input-group">
                <label for="txt-username"><strong>Nombre / ID del Dispositivo:</strong></label>
                <input type="text" id="txt-username" placeholder="Ej. Conductor_Juan, Auto_01" value="Conductor_1">
            </div>

            <button id="btn-start" class="btn btn-primary">Iniciar Transmisión GPS</button>
            <button id="btn-stop" class="btn btn-danger" disabled>Detener Transmisión</button>
            
            <div class="coords-info">
                <p><strong>Latitud:</strong> <span id="lbl-lat">0.000000</span></p>
                <p><strong>Longitud:</strong> <span id="lbl-lng">0.000000</span></p>
                <p><strong>Última actualización:</strong> <span id="lbl-time">-</span></p>
            </div>
        </section>
    </main>

    <!-- Script del Emisor -->
    <script type="module" src="js/tracker-controller.js"></script>
</body>
</html>
